[DEAFED_esp32s3-n16r8_e22-900m30s]
extends = esp32_base
board = ESP32-S3-DevKitC-1-N16R8

build_flags = ${esp32_base.build_flags}
  -I variants/DEAFED_esp32s3-n16r8_e22-900m30s
  -D DEAFED_esp32s3-n16r8_e22-900m30s

  -D ESP32_CPU_FREQ=240

  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper

  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=39

  -D DISPLAY_CLASS=SSD1306Display

  -D P_LORA_NSS=15
  -D P_LORA_SCLK=14
  -D P_LORA_MOSI=13
  -D P_LORA_MISO=12
  -D P_LORA_RESET=40
  -D P_LORA_BUSY=41
  -D P_LORA_DIO_1=42

  -D P_LORA_DIO_2=37
  -D SX126X_DIO2_AS_RF_SWITCH=true

  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=2
  -D SX126X_MAX_POWER=18
  -D TX_GAIN_LORA=8
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140

  -D CORE_DEBUG_LEVEL=5
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1

build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/DEAFED_esp32s3-n16r8_e22-900m30s>
  +<helpers/ui/SSD1306Display.cpp>

lib_deps = ${esp32_base.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306



[env:DEAFED_esp32s3-n16r8_e22-900m30s_repeater]
extends = DEAFED_esp32s3-n16r8_e22-900m30s

build_flags = ${DEAFED_esp32s3-n16r8_e22-900m30s.build_flags}
  -D ADVERT_NAME='"DEAFED Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"qwerty123"'
  -D MAX_NEIGHBOURS=128

  -D WITH_MQTT_UPLINK=1
  -D MQTT_DEBUG=1
  -D WIFI_SSID='""'
  -D WIFI_PWD='""'
  -D MQTT_DEFAULT_IATA='"UNSET"'
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1

build_src_filter = ${DEAFED_esp32s3-n16r8_e22-900m30s.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<helpers/mqtt/*.cpp>
  +<helpers/web/*.cpp>

lib_deps = ${DEAFED_esp32s3-n16r8_e22-900m30s.lib_deps}
  bakercp/CRC32
